<svg viewBox="0 0 740 262" width="740" height="262" role="img" aria-labelledby="grammar-title" xmlns="http://www.w3.org/2000/svg" style="font: 13px Arial, sans-serif">
  <title id="grammar-title">The containment grammar of the five spatial types</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#768798" />
    </marker>
    <marker id="arr-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf715e" />
    </marker>
  </defs>
  <path d="M 70 110 C 55 66, 115 66, 100 112" marker-end="url(#arr)" fill="none" stroke="#768798" stroke-width="1.4" />
  <path d="M 240 110 C 225 66, 285 66, 270 112" marker-end="url(#arr-err)" fill="none" stroke="#bf715e" stroke-width="1.4" stroke-dasharray="5 3" />
  <path d="M 425 100 C 410 56, 470 56, 455 102" marker-end="url(#arr)" fill="none" stroke="#768798" stroke-width="1.4" />
  <path d="M 630 110 C 615 66, 675 66, 660 112" marker-end="url(#arr)" fill="none" stroke="#768798" stroke-width="1.4" />
  <text x="85" y="60" text-anchor="middle" fill="#737b83" font-size="11">nests</text>
  <text x="255" y="60" text-anchor="middle" fill="#bf715e" font-size="11">error: use AecoFacilityPart</text>
  <text x="440" y="50" text-anchor="middle" fill="#737b83" font-size="11">nests (wing ⊃ storey ⊃ mezzanine)</text>
  <text x="645" y="60" text-anchor="middle" fill="#737b83" font-size="11">nests</text>
  <line x1="150" y1="132" x2="186" y2="132" marker-end="url(#arr)" fill="none" stroke="#768798" stroke-width="1.4" />
  <line x1="320" y1="132" x2="356" y2="132" marker-end="url(#arr)" fill="none" stroke="#768798" stroke-width="1.4" />
  <line x1="520" y1="132" x2="576" y2="132" marker-end="url(#arr)" fill="none" stroke="#768798" stroke-width="1.4" />
  <path d="M 85 154 C 85 240, 665 240, 665 158" marker-end="url(#arr)" fill="none" stroke="#768798" stroke-width="1.4" />
  <path d="M 255 154 C 255 208, 622 208, 622 158" marker-end="url(#arr)" fill="none" stroke="#768798" stroke-width="1.4" />
  <rect x="20" y="110" width="130" height="44" rx="3" fill="none" stroke="#768798" stroke-width="1.2" />
  <text x="85" y="137" text-anchor="middle" fill="#737b83" font-weight="700">AecoSite</text>
  <rect x="190" y="110" width="130" height="44" rx="3" fill="none" stroke="#768798" stroke-width="1.2" />
  <text x="255" y="137" text-anchor="middle" fill="#737b83" font-weight="700">AecoFacility</text>
  <rect x="360" y="100" width="160" height="64" rx="3" fill="none" stroke="#768798" stroke-width="1.2" />
  <text x="440" y="124" text-anchor="middle" fill="#737b83" font-weight="700">AecoFacilityPart</text>
  <text x="440" y="148" text-anchor="middle" fill="#737b83" font-size="11">AecoLevel : AecoFacilityPart</text>
  <rect x="580" y="110" width="130" height="44" rx="3" fill="none" stroke="#768798" stroke-width="1.2" />
  <text x="645" y="137" text-anchor="middle" fill="#737b83" font-weight="700">AecoSpace</text>
  <text x="20" y="256" fill="#737b83" font-size="11">An arrow means "may contain". Every type nests except AecoFacility.</text>
</svg>
